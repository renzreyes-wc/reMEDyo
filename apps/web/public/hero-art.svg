<!-- Decorative only. Peach and lilac carry no meaning here; the spec forbids
     either hue from indicating state, so this is pure ground behind the hero. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" aria-hidden="true">
  <defs>
    <radialGradient id="peach" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#ffe2c9"/>
      <stop offset="100%" stop-color="#ffe2c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lilac" cx="75%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#d9d4f6"/>
      <stop offset="100%" stop-color="#d9d4f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mint" cx="60%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#d8f0e7"/>
      <stop offset="100%" stop-color="#d8f0e7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="520" fill="url(#mint)"/>
  <circle cx="180" cy="130" r="170" fill="url(#peach)"/>
  <circle cx="470" cy="400" r="150" fill="url(#lilac)"/>
</svg>
