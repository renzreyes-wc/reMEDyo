# reMEDyo — the whole system, locally, in one command.
#
#   docker compose up --build
#
# Brings up Postgres, waits for it to be genuinely healthy, applies migrations,
# seeds demonstration data, and serves the app. No second terminal, no manual
# migrate step: a reviewer should reach a populated, working application from a
# clean checkout without reading anything first.

services:
  postgres:
    image: postgres:18-alpine
    container_name: remedyo-postgres
    environment:
      POSTGRES_USER: remedyo
      POSTGRES_PASSWORD: remedyo
      POSTGRES_DB: remedyo
    ports:
      # Exposed so you can inspect the database with psql while it runs.
      - "5433:5432"
    volumes:
      # Postgres 18+ expects a single mount at /var/lib/postgresql and places
      # the cluster in a version-named subdirectory itself. Mounting the old
      # /var/lib/postgresql/data path makes the entrypoint refuse to start.
      - remedyo-db:/var/lib/postgresql
    healthcheck:
      # The api waits on this rather than on a fixed sleep, so a slow first
      # boot cannot race the migration step.
      test: ["CMD-SHELL", "pg_isready -U remedyo -d remedyo"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # The clinical-assist model, self-hosted.
  #
  # Not a hosted service: it is a container in this compose file, on this
  # network, with no port published to the host and no outbound call to a
  # vendor. `docker compose up --build` is still the whole setup story.
  #
  # Deliberately NOT in the api's depends_on. The first boot pulls ~2 GB, and
  # the application must be fully usable throughout — the assist surfaces
  # simply report unavailable until the model is there.
  ollama:
    image: ollama/ollama:latest
    container_name: remedyo-ollama
    environment:
      OLLAMA_MODEL: ${LLM_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./docker/ollama-entrypoint.sh:/entrypoint.sh:ro
      # The model cache. Survives a rebuild, so the pull happens once.
      - remedyo-models:/root/.ollama
    healthcheck:
      # Healthy means "the model is loaded and answering", not merely that the
      # server is up — nothing but a served model is useful to the api.
      # $$ escapes compose interpolation: the shell inside the container
      # expands this, using the OLLAMA_MODEL set on the service above.
      test: ["CMD-SHELL", "ollama list | grep -q \"$${OLLAMA_MODEL%%:*}\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: remedyo-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://remedyo:remedyo@postgres:5432/remedyo?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      NODE_ENV: production
      # Clinical assist. Set LLM_ENABLED=false to run without the model
      # entirely — the assist surfaces disappear and everything else is
      # exactly as it was.
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      # Interactive API documentation, mounted at /api/docs. Off unless this
      # is exactly "true".
      #
      # It must be named here to reach the container. This service passes an
      # explicit environment map rather than an env_file, and only the
      # variables listed are forwarded — so putting SWAGGER_UI in .env has no
      # effect unless a line like this interpolates it.
      SWAGGER_UI: ${SWAGGER_UI:-false}
    ports:
      - "4000:4000"
    healthcheck:
      test:
        ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked at build time: the browser resolves this, not the container,
        # so it must be the host-visible address rather than "api".
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: remedyo-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  remedyo-db:
  # The model cache, so the first-boot pull happens exactly once.
  remedyo-models:
