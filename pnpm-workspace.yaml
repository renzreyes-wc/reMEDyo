packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  '@tailwindcss/oxide': true
  sharp: true
  unrs-resolver: true
  # Transitive dependency of swagger-ui-dist, pulled in by @nestjs/swagger.
  # Its install script only reports anonymous usage telemetry; deny it.
  '@scarf/scarf': false
  # Pulled in by the Docusaurus toolchain. Its install script only prints a
  # funding notice; nothing it does is needed to build the site.
  core-js: false
  # The TypeScript transform the integration tests run under, since esbuild —
  # which vitest uses by default — does not emit the decorator metadata Nest's
  # injector needs. A native module, so its install step is a real one.
  '@swc/core': true

minimumReleaseAgeExclude:
  - '@nestjs/swagger@12.0.2'
